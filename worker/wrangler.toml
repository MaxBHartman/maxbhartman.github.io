name = "strava-live"
main = "src/index.js"
compatibility_date = "2024-11-01"

# `wrangler kv namespace create STRAVA_KV` prints an id — paste it below.
kv_namespaces = [
  { binding = "STRAVA_KV", id = "c52f179002544600aa271b5568c55fa6" }
]

routes = [
  { pattern = "maxhartman.net/api/strava*", zone_name = "maxhartman.net" }
]

# Daily at 08:00 UTC — resolves geo/weather for any activities not yet enriched.
[triggers]
crons = ["0 8 * * *"]
